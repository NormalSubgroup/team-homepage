name: Deploy Pages

on:
  # Deploy after CI completes for the same SHA; CodeQL runs in parallel and does not gate deploy
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gate on CI only (same SHA)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          echo "Checking gates for $OWNER/$REPO @ $SHA"
          ci=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$OWNER/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA" | jq -r '.workflow_runs[0].conclusion // empty')
          echo "CI: $ci"
          if [ "$ci" = "success" ]; then echo "ready=true" >> $GITHUB_OUTPUT; else echo "ready=false" >> $GITHUB_OUTPUT; fi

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        if: ${{ steps.gate.outputs.ready == 'true' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        if: ${{ steps.gate.outputs.ready == 'true' }}

      - name: Install deps (npm)
        run: npm install --no-package-lock
        if: ${{ steps.gate.outputs.ready == 'true' }}

      - name: Build site (Vite)
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
        if: ${{ steps.gate.outputs.ready == 'true' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
        if: ${{ steps.gate.outputs.ready == 'true' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: ${{ needs.build.outputs.ready == 'true' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
